name: Plan Visualizer

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'docs/RELEASE_PLAN.md'
      - 'docs/TEST_CASES.md'
      - 'docs/BUGS.md'
      - 'docs/AI_COST_LOG.md'
      - 'progress.md'
      - '.github/workflows/plan-visualizer.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage || true

      - name: Generate plan-status.html
        run: node tools/generate-plan.js

      - name: Generate SDLC dashboard
        run: node tools/generate-dashboard.js

      - name: Upload generated dashboards
        uses: actions/upload-artifact@v4
        with:
          name: dashboards
          path: |
            docs/plan-status.html
            docs/plan-status.json
            docs/dashboard.html
          retention-days: 30
