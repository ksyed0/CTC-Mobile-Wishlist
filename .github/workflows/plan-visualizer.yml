name: Plan Visualizer

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "docs/RELEASE_PLAN.md"
      - "docs/TEST_CASES.md"
      - "docs/BUGS.md"
      - "docs/AI_COST_LOG.md"
      - "progress.md"
      - ".github/workflows/plan-visualizer.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage || true

      - name: Generate plan-status.html
        run: node tools/generate-plan.js

      - name: Generate SDLC dashboard
        run: node tools/generate-dashboard.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/plan-status.html docs/dashboard.html || true
          git diff --cached --quiet || git commit -m "chore: regenerate plan visualizer dashboard"
          git push || true
